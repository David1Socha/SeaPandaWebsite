name: Deploy Sea Panda Creative

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/build.mjs --base "$BASE_PATH"
          node scripts/check.mjs --base "$BASE_PATH"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
